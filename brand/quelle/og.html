<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(Manrope.ttf);font-weight:200 800}
html,body{margin:0}
body{width:1200px;height:630px;background:#060b16;position:relative;overflow:hidden;font-family:M}
.glow{position:absolute;inset:0;background:radial-gradient(700px 420px at 50% 42%,rgba(79,141,255,.22),transparent 70%),radial-gradient(500px 260px at 85% 110%,rgba(217,184,119,.10),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(closest-side,#000,transparent)}
.logo{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);height:330px}
.url{position:absolute;bottom:40px;width:100%;text-align:center;color:#8bb8ff;font-weight:600;letter-spacing:.2em;font-size:20px}
</style></head><body><div class="glow"></div><div class="grid"></div>
<img class="logo" src="../svg/tarifwerk-logo-gestapelt-dark.svg"><div class="url">WWW.TARIFWERK.EU</div></body></html>
